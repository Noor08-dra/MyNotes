{% extends "Notes/base.html" %}
{% load crispy_forms_tags %}

{% block title %}
    {% if note %}Edit Note{% else %}Create Note{% endif %}
{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex justify-content-center align-items-center" style="background: #f0f2f5;">
    <div class="col-lg-6 col-md-8">
        <div class="card rounded-4 shadow" style="background-color: #ffffff; border: none;">
            <div class="card-body p-5">
                <h3 class="text-center mb-4 fw-semibold text-secondary">
                    {% if note %}Edit Note{% else %}Create a New Note{% endif %}
                </h3>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form }}

                    <div class="d-flex justify-content-end gap-3 mt-4">
                        <a href="{% url 'notes_list' %}" class="btn btn-outline-secondary px-4 py-2">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-primary px-4 py-2">
                            {% if note %}Save Changes{% else %}Create{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
