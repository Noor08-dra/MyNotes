{% extends "Notes/base.html" %}
{% load crispy_forms_tags %}

{% block title %}
    {% if note %}Edit Note{% else %}Create Note{% endif %}
{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex justify-content-center align-items-center" style="background: #f0f2f5;">
    <div class="col-lg-6 col-md-8">
        <div class="card rounded-4 shadow" style="background-color: #ffffff; border: none;">
            <div class="card-body p-5">
                <h3 class="text-center mb-4 fw-semibold text-secondary">
                  Edit your reply
                </h3>

                <form method="post">
                    {% csrf_token %}
                    {% crispy form %}
                    <div class="d-flex justify-content-center mt-2">
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-3" onclick="window.history.back()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
