{% extends "Notes/base.html" %}

{% block title %}Note deletion confirmation {% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-md-6 col-lg-5 text-center">
        
        <div class="card shadow-lg border-0 rounded-4 p-4">
            <div class="card-body">
                <h3 class="card-title mb-3">Confirm Deletion</h3>
                
                <p class="card-text text-muted mb-4">
                    Are you sure you want to permanently delete this note?
                    <br><strong>"{{ note.note_text|truncatechars:50 }}"</strong>
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'detail_page' note.pk %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
